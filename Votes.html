<html>
    <head>
        <title>months</title>

    <body>
        <h1>months</h1>
         <script>
        let month=Number(prompt("enter your month:"))
        
        switch(month){
            case 1:
                document.write("this month jan")
                break;
            case 2:
                document.write("this month is feb")    
                break;
            case 3:
                document.write("this month march")
                break; 
             case 4:
                document.write("this month april")
                break; 
             case 5:
                document.write("this month may")
                break;
             case 6:
                document.write("this month june")
                break;
             case 7:     
                document.write("this month july")
                break;
             case 8:
                document.write("this month august")
                break;
             case 9:
                document.write("this month sept")
                break;    
             case 10:
                document.write("this month oct")
                break;   
             case 11:
                document.write("this month nov")
                break; 
             case 12:
                document.write("this month dec")
                break;           
            default:
                document.write("unknown")  
             }
    </script>
    </body>
    </head>
</html>
