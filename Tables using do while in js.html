<html>
    <head>
        <title>Tables </title>
    </head>
    <body>
        <h1>Math Tables</h1>
        <script>
            let a = 1;
            do{
                document.write(`10*${a}=${10*a}<br>`);
                a++

            }while(a <= 10);
        </script>
    </body>
</html>
